# Volunteer form (content/volunteer, layouts/volunteer/list.html).
# Field names and option values are the Airtable column names and choices:
# they are sent in English whatever the page language.
# Labels are i18n keys "Volunteer-form-<key>-..." (see layouts/volunteer/list.html);
# option labels are i18n keys "Volunteer-option-<value | urlize>", falling back to the English value.
# "page" is a path under content/ (linked in the current language), "url" an external link.

sections:
  - key: software
    tasks:
      - key: reviewing-packages
        field: Reviewing packages
        page: /software-review
        groups:
          - key: domain-expertise
            field: Domain expertise EN
            required: false
            options:
              - Atmospheric sciences
              - Bibliometrics (Scientific literature access, Scientific bibliography, Library science)
              - Bioinformatics
              - Chemistry
              - Clinical research
              - Computer sciences
              - Ecology
              - Epidemiology
