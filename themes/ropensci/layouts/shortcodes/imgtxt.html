{{- /*
  An image floated to one side (side: "left" by default) with text next to it, used in the rOpenSci profile posts.
  Parameters: src, alt or caption, side, link (with target and rel), height and width (250px by default).
*/ -}}
      {{- if .Get "side" -}}<div class="float-{{ (.Get "side") }}">{{ else }}<div class="float-left">{{- end -}}
                <figure class="m-0">
                  {{- if .Get "link" -}}
        <a href="{{ .Get "link" }}"{{ with .Get "target" }} target="{{ . }}"{{ end }}{{ with .Get "rel" }} rel="{{ . }}"{{ end }}>
    {{- end -}}
    <img src="{{ .Get "src" }}"
         {{- if or (.Get "alt") (.Get "caption") }}
         alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
         {{- end }}
         style="  object-fit: cover; object-position: center;  height: {{ .Get "height" | default "250px" }};  width: {{ .Get "width" | default "250px" }}; margin-right: 15px"
    /> <!-- Closing img tag -->
    {{- if .Get "link" }}</a>{{ end -}}
                  {{ with .Get "caption" }} 
  <figcaption>
  {{ . }}
  </figcaption>
  {{ end }}
                <p>
                  {{ .Inner | markdownify }}
                </p>
                </figure>
              </div>
<div style="clear: both;"></div>
